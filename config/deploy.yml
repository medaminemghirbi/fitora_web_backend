# Kamal 2 deploy config for Fitora.  Run from backend/:  kamal deploy
#
# Fill every <PLACEHOLDER> before the first deploy, then:
#   bin/kamal setup            # first time (installs Docker, boots accessories)
#   bin/kamal deploy           # subsequent releases
#
# One box runs everything: the Rails app (API + baked-in Angular SPA on one
# origin), a Sidekiq worker, plus Postgres and Redis as accessories, and a
# backup accessory that ships a nightly dump off the box.

service: fitora

image: <REGISTRY_USER>/fitora

servers:
  web:
    - <VPS_IP>
  worker:
    hosts:
      - <VPS_IP>
    cmd: bundle exec sidekiq
    env:
      clear:
        RAILS_MAX_THREADS: 10

proxy:
  ssl: true
  host: <APP_DOMAIN>          # e.g. app.fitora.io — DNS A record → <VPS_IP>
  app_port: 3000
  healthcheck:
    path: /up

registry:
  server: ghcr.io            # or docker.io
  username: <REGISTRY_USER>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: ..                # repo root — Dockerfile builds backend/ + frontend/
  dockerfile: backend/Dockerfile

env:
  clear:
    RAILS_ENV: production
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5
    RAILS_LOG_LEVEL: info
    APP_HOST: <APP_DOMAIN>
    FRONTEND_ORIGINS: https://<APP_DOMAIN>
    MAIL_FROM: "Fitora <no-reply@<APP_DOMAIN>>"
    REDIS_URL: redis://fitora-redis:6379/1
    # The password comes from BACKEND_DATABASE_PASSWORD (config/database.yml).
    DB_HOST: fitora-db
    DB_USER: fitora
    DB_NAME: backend_production
    SMTP_ADDRESS: <SMTP_HOST>
    SMTP_PORT: 587
  # SMTP and APP_HOST are checked at boot (config/initializers/required_env.rb):
  # missing, they stop the deploy instead of failing quietly later.
  secret:
    - RAILS_MASTER_KEY
    - BACKEND_DATABASE_PASSWORD
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - FITORA_RIB
    - FITORA_BANK_NAME
    - FITORA_ACCOUNT_HOLDER
    - FITORA_SWIFT
    - SENTRY_DSN
    - SIDEKIQ_WEB_PASSWORD
    - TUNISIESMS_API_KEY
    # add S3 creds here once storage.yml :production points at a bucket
    # - AWS_ACCESS_KEY_ID
    # - AWS_SECRET_ACCESS_KEY

accessories:
  db:
    image: postgres:16
    host: <VPS_IP>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: fitora
        POSTGRES_DB: backend_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  redis:
    image: redis:7
    host: <VPS_IP>
    port: "127.0.0.1:6379:6379"
    directories:
      - data:/data

  # A nightly pg_dump, encrypted with PASSPHRASE and shipped off the box to
  # an S3-compatible bucket, kept 14 days. The database runs on the same VPS
  # as everything else, so a copy that lives there too is not a backup.
  # Restore-test one regularly: `bin/rails backup:restore_check FILE=…`
  # (README → Backups). A backup nobody has restored is not a backup either.
  backup:
    image: eeshugerman/postgres-backup-s3:16
    host: <VPS_IP>
    env:
      clear:
        SCHEDULE: "@daily"
        BACKUP_KEEP_DAYS: 14
        S3_REGION: <BACKUP_S3_REGION>
        S3_BUCKET: <BACKUP_S3_BUCKET>
        S3_PREFIX: postgres
        # S3_ENDPOINT: https://<endpoint>   # any S3-compatible store that is not AWS
        POSTGRES_HOST: fitora-db
        POSTGRES_DATABASE: backend_production
        POSTGRES_USER: fitora
      secret:
        - POSTGRES_PASSWORD
        - S3_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY
        - PASSPHRASE

# Uploaded files live on local disk until storage.yml :production points at
# S3 — named volume so a redeploy doesn't wipe them.
volumes:
  - "fitora_storage:/rails/storage"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  migrate: app exec "bin/rails db:migrate"
